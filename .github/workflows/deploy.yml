name: Deploy FLYWAY to Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Pages needs these to publish; contents:read is enough to check the code out.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait for the running one rather than cancelling it,
# so a half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` runs tsc --noEmit first, so a type error fails the
      # deploy rather than shipping a broken build.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
