<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LOW TIDE — key art</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  canvas{display:block;width:100vw;height:100vh}
  #t{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);color:#cfe0e8;opacity:.75;
     font:16px Georgia,serif;letter-spacing:.55em;text-transform:uppercase;text-shadow:0 0 14px rgba(160,220,255,.4)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="t">Low&nbsp;Tide</div>
<script>
const cv = document.getElementById('cv');
const gl = cv.getContext('webgl2', {antialias:false});
function fit(){ cv.width = innerWidth*Math.min(devicePixelRatio,2); cv.height = innerHeight*Math.min(devicePixelRatio,2); gl.viewport(0,0,cv.width,cv.height); }
fit(); addEventListener('resize', fit);

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

const FS = `#version 300 es
precision highp float;
uniform vec2 R; uniform float T;
out vec4 O;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
             mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){
  float v = 0., a = .5;
  for (int i=0;i<5;i++){ v += a*noise(p); p *= 2.03; a *= .5; }
  return v;
}
float sdEllipse(vec2 p, vec2 c, vec2 r){ return length((p-c)/r) - 1.; }
float smin(float a, float b, float k){ float h = clamp(.5+.5*(b-a)/k, 0., 1.); return mix(b,a,h)-k*h*(1.-h); }

void main(){
  vec2 uv = gl_FragCoord.xy / R;
  vec2 q = uv; q.x *= R.x/R.y;          // aspect-corrected
  float t = T;
  float HOR = 0.42;

  // ---------------- sky ----------------
  vec3 skyTop = vec3(0.020,0.038,0.075);
  vec3 skyHor = vec3(0.075,0.145,0.205);
  vec3 col = mix(skyHor, skyTop, smoothstep(HOR, 1.0, uv.y));

  // stars
  vec2 sg = uv*vec2(160.,90.);
  if (hash(floor(sg)) > 0.985 && uv.y > HOR+0.08){
    float d = length(fract(sg)-.5);
    col += vec3(.8,.9,1.)*smoothstep(.4,.0,d)*.35*(.5+.5*sin(t*2.+hash(floor(sg))*40.));
  }

  // moon — huge, low, hazed
  vec2 mc = vec2(0.70*R.x/R.y, 0.66);
  float md = length(q-mc);
  float moonR = 0.115;
  col += vec3(.92,.96,1.0) * smoothstep(moonR+0.004, moonR-0.004, md) * 0.85;
  col += vec3(.75,.85,1.0) * exp(-md*7.0) * 0.28;                       // halo
  // moon craters
  if (md < moonR){
    float cr = fbm((q-mc)*26.);
    col -= vec3(.10,.10,.08)*smoothstep(.55,.75,cr);
  }
  // thin cloud bands crossing the moon
  float cl = fbm(vec2(q.x*3.0 - t*0.01, uv.y*22.0));
  float band = smoothstep(.55,.75, cl) * smoothstep(HOR+0.05, HOR+0.3, uv.y) * smoothstep(0.9, 0.55, uv.y);
  col = mix(col, vec3(0.045,0.075,0.115), band*0.75);

  // the waiting tide — a white line burning on the horizon
  float tideBreak = fbm(vec2(q.x*9.0 + t*0.05, 3.7));
  float tideGlow = exp(-abs(uv.y-HOR)*90.0) * (0.55+0.45*tideBreak);
  col += vec3(.75,.92,1.0)*tideGlow*.85;
  col += vec3(.45,.75,.95)*exp(-abs(uv.y-HOR)*22.0)*.22;

  // ---------------- seabed ----------------
  if (uv.y < HOR){
    float depth = (HOR-uv.y)/HOR;                    // 0 at horizon, 1 at bottom
    vec3 sand = mix(vec3(0.065,0.115,0.150), vec3(0.016,0.030,0.045), smoothstep(0.,0.8,depth));
    // ripple texture
    float rip = fbm(vec2(q.x*14., uv.y*90.))*0.5 + fbm(vec2(q.x*40., uv.y*180.))*0.2;
    sand *= 0.85 + rip*0.35;
    col = sand;

    // wet-sand moon reflection: broken vertical streak under the moon
    float rx = abs(q.x-mc.x);
    float streak = exp(-rx*rx*46.0) * (0.4+0.6*fbm(vec2(q.x*60., uv.y*30.-t*0.1)));
    col += vec3(.65,.80,.95) * streak * (1.0-depth) * 0.5;
    // tide pools: sparse glints
    vec2 pg = vec2(q.x*22., uv.y*60.);
    if (hash(floor(pg)) > 0.965){
      float d = length(fract(pg)-.5);
      col += vec3(.7,.9,1.)*smoothstep(.25,.0,d)*.5*(1.-depth);
    }
    // horizon haze sitting on the ground
    col = mix(col, vec3(0.10,0.17,0.22), (1.0-depth)*(1.0-depth)*0.5);
  }

  // ---------------- leviathans (silhouette layers, far to near) ----------------
  // L1: far whale-back, left
  {
    float br = 1.0 + 0.012*sin(t*0.45);
    float d = sdEllipse(q, vec2(0.30, 0.435), vec2(0.34, 0.085*br));
    d = smin(d, sdEllipse(q, vec2(0.60, 0.425), vec2(0.10, 0.115*br)), 0.35); // tail rise
    float m = smoothstep(0.012, -0.012, d);
    col = mix(col, vec3(0.075,0.125,0.165), m);
    // its dark reflection on the wet sand
    float rd = sdEllipse(q, vec2(0.30, 0.36), vec2(0.30, 0.03));
    col = mix(col, col*0.8, smoothstep(0.05,-0.05, rd));
  }
  // L2: colossal mid-right with dorsal fin
  {
    float br = 1.0 + 0.010*sin(t*0.32+2.0);
    vec2 c = vec2(1.28, 0.40);
    float d = sdEllipse(q, c, vec2(0.46, 0.16*br));
    // dorsal fin
    vec2 fp = q - vec2(1.22, 0.545);
    float fin = max(abs(fp.x*1.6+fp.y*0.5)-0.035+fp.y*0.55, -fp.y-0.01);
    d = min(d, fin);
    float m = smoothstep(0.010, -0.010, d);
    col = mix(col, vec3(0.030,0.055,0.075), m);
    // breathing blowhole mist
    float mist = exp(-length((q-vec2(1.05,0.575))*vec2(8.,14.))*3.0);
    col += vec3(.5,.65,.75)*mist*(0.25+0.25*sin(t*0.32+2.5))*0.5;
    // reflection
    float rd = sdEllipse(q, vec2(1.28, 0.33), vec2(0.40, 0.035));
    col = mix(col, col*0.75, smoothstep(0.05,-0.05, rd));
  }
  // L3: near-black colossus entering frame left
  {
    float d = sdEllipse(q, vec2(-0.18, 0.30), vec2(0.42, 0.34));
    float m = smoothstep(0.008, -0.008, d);
    col = mix(col, vec3(0.010,0.016,0.022), m);
  }

  // ground haze bands between layers
  float haze = fbm(vec2(q.x*2.2 - t*0.02, uv.y*7.0));
  col += vec3(0.07,0.12,0.16) * smoothstep(.5,.85,haze) * smoothstep(0.55,0.38,uv.y) * smoothstep(0.15,0.35,uv.y) * 0.55;

  // ---------------- the walker ----------------
  {
    vec2 pc = vec2(0.62, 0.315);
    // lantern warm light pool
    float ld = length((q-pc-vec2(0.012,0.004))*vec2(1.0,1.6));
    col += vec3(1.0,0.62,0.28) * exp(-ld*26.0) * 0.85;
    col += vec3(1.0,0.45,0.18) * exp(-ld*90.0) * 0.9;
    // warm reflection streak below
    float wr = abs(q.x-pc.x-0.012);
    col += vec3(1.0,0.55,0.25) * exp(-wr*wr*900.0) * exp(-(pc.y-uv.y)*30.0) * step(uv.y, pc.y) * 0.35;
    // figure silhouette: legs, body, head
    float body = sdEllipse(q, pc+vec2(0.0,0.010), vec2(0.0060,0.0160));
    float head = sdEllipse(q, pc+vec2(0.0008,0.030), vec2(0.0042,0.0050));
    float legL = sdEllipse(q, pc+vec2(-0.0026,-0.008), vec2(0.0022,0.0110));
    float legR = sdEllipse(q, pc+vec2( 0.0034,-0.008), vec2(0.0022,0.0110));
    float fig = min(min(body,head), min(legL,legR));
    col = mix(col, vec3(0.004,0.006,0.010), smoothstep(0.35,-0.35,fig/0.004));
    // lantern spark itself
    float sp = length(q-pc-vec2(0.0135,0.006));
    col += vec3(1.0,0.85,0.55)*smoothstep(0.0035,0.0005,sp)*1.4;
  }

  // ---------------- grade ----------------
  col = col / (col + 0.72);                       // soft tonemap
  col = pow(col, vec3(0.92,0.96,1.02));           // cool grade
  float vd = length(uv-vec2(0.5,0.46));
  col *= 1.0 - smoothstep(0.45,0.95,vd)*0.6;      // vignette
  col += (hash(uv*R.xy+fract(t))-0.5)*0.030;      // grain
  O = vec4(col,1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uR = gl.getUniformLocation(prog,'R'), uT = gl.getUniformLocation(prog,'T');
function frame(ts){
  gl.uniform2f(uR, cv.width, cv.height);
  gl.uniform1f(uT, ts/1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
