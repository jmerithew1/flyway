<svg xmlns="http://www.w3.org/2000/svg" width="140" height="80" viewBox="0 0 140 80">
  <!-- Broken lower edge of a wall span — stone sheared off from beneath, so the
       teeth hang downward at differing lengths with one long surviving spur. -->
  <g>
    <path fill="#544a70" d="
      M 17,0
      L 123,0
      L 113,40 L 104,36 L 101,58 L 92,54 L 89,28
      L 79,44 L 71,26 L 66,50 L 57,46 L 54,66
      L 43,62 L 40,34 L 30,38 L 27,20 L 22,24
      Z"/>
    <!-- the sheared faces catch a little light on their left sides -->
    <path fill="#8b7ba6" opacity="0.45" d="
      M 22,24 L 27,20 L 30,38 L 25,42 Z
      M 40,34 L 43,62 L 38,58 L 36,36 Z
      M 66,50 L 71,26 L 74,32 L 70,54 Z"/>
    <path fill="#3f3560" opacity="0.55" d="M 101,58 L 104,36 L 113,40 L 109,62 Z"/>
  </g>
</svg>
