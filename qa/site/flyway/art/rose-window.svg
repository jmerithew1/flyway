<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- Circular ruined opening. The stone ring survives about three quarters of
       the way round; the lower-left quadrant has fallen, leaving broken ends.
       Surviving tracery spokes are snapped at different lengths. -->
  <g>
    <!-- ring: outer circle minus inner circle, with a gap cut out -->
    <path fill="#544a70" fill-rule="evenodd" d="
      M 110,6
      A 104,104 0 1 1 109.9,6
      Z
      M 110,36
      A 74,74 0 1 0 110.1,36
      Z"/>
    <!-- knock out the collapsed lower-left quadrant of the ring -->
    <path fill="#6d5a8b" d="M 110,110 L 8,110 A 102,102 0 0 0 62,198 Z"/>
    <!-- broken ends where the ring shears off -->
    <path fill="#544a70" d="M 6,104 L 36,104 L 32,120 L 14,124 Z"/>
    <path fill="#544a70" d="M 60,196 L 74,172 L 88,180 L 76,204 Z"/>
    <!-- sun-side lit inner lip -->
    <path fill="#8b7ba6" opacity="0.5" d="
      M 110,36 A 74,74 0 0 0 40,132 L 28,127
      A 86,86 0 0 1 110,24 Z"/>
    <!-- shadowed outer right flank -->
    <path fill="#3b3159" opacity="0.5" d="
      M 214,110 A 104,104 0 0 1 150,206 L 143,193
      A 90,90 0 0 0 200,110 Z"/>
    <!-- surviving tracery: spokes snapped at uneven lengths, plus a hub -->
    <g fill="#544a70">
      <path d="M 104,40 L 116,40 L 114,86 L 106,86 Z"/>
      <path d="M 168,68 L 175,78 L 140,100 L 136,93 Z"/>
      <path d="M 178,140 L 172,150 L 139,127 L 143,120 Z"/>
      <path d="M 96,178 L 104,176 L 112,140 L 104,140 Z"/>
      <circle cx="110" cy="110" r="17"/>
    </g>
    <path fill="#8b7ba6" opacity="0.55" d="M 104,40 L 110,40 L 108,86 L 106,86 Z"/>
    <path fill="#8b7ba6" opacity="0.45" d="M 93,110 A 17,17 0 0 1 110,93 L 110,101 A 9,9 0 0 0 101,110 Z"/>
  </g>
</svg>
