<svg xmlns="http://www.w3.org/2000/svg" width="140" height="400" viewBox="0 0 140 400" preserveAspectRatio="none">
  <!-- Ruined wall shaft. Stretched vertically to fill a span, so all the
       character lives in the irregular left/right edges: bulges, chipped
       corners, a spalled bite out of one side. Authored in final palette. -->
  <g>
    <!-- main stone mass: neither edge is straight -->
    <path fill="#544a70" d="
      M 22,0
      L 20,58 L 25,96 L 18,150 L 23,212 L 17,268 L 24,322 L 19,400
      L 121,400 L 116,338 L 123,282 L 117,224 L 122,166 L 115,110 L 121,54 L 117,0
      Z"/>
    <!-- sun-side rim light down the left face -->
    <path fill="#8b7ba6" opacity="0.55" d="
      M 22,0 L 20,58 L 25,96 L 18,150 L 23,212 L 17,268 L 24,322 L 19,400
      L 33,400 L 37,320 L 31,266 L 36,210 L 30,150 L 38,95 L 33,56 L 35,0 Z"/>
    <!-- shadowed right face -->
    <path fill="#3f3560" opacity="0.7" d="
      M 103,0 L 105,54 L 99,110 L 106,166 L 101,224 L 107,282 L 100,338 L 105,400
      L 121,400 L 116,338 L 123,282 L 117,224 L 122,166 L 115,110 L 121,54 L 117,0 Z"/>
    <!-- spalled bite out of the left edge -->
    <path fill="#3f3560" opacity="0.5" d="M 17,244 L 34,252 L 30,278 L 18,270 Z"/>
    <!-- coursing joints, uneven spacing, never spanning the full width -->
    <g fill="#3b3159" opacity="0.45">
      <rect x="24" y="72"  width="88" height="4"/>
      <rect x="30" y="139" width="76" height="3"/>
      <rect x="22" y="196" width="94" height="4"/>
      <rect x="34" y="258" width="70" height="3"/>
      <rect x="24" y="311" width="86" height="4"/>
      <rect x="28" y="366" width="80" height="3"/>
    </g>
    <!-- hairline crack running down from a joint -->
    <path fill="#3b3159" opacity="0.5" d="M 74,196 L 78,232 L 72,266 L 76,300 L 71,300 L 67,266 L 72,232 L 69,196 Z"/>
  </g>
</svg>
