<svg xmlns="http://www.w3.org/2000/svg" width="160" height="420" viewBox="0 0 160 420" preserveAspectRatio="none">
  <!-- Free-standing broken column: fractured drum capital, tapering fluted
       shaft with one deep spall, slumped base. Asymmetric throughout. -->
  <g>
    <!-- capital drum, cracked across one corner -->
    <path fill="#544a70" d="M 30,46 L 128,40 L 133,74 L 26,80 Z"/>
    <path fill="#8b7ba6" opacity="0.6" d="M 30,46 L 48,45 L 44,79 L 26,80 Z"/>
    <path fill="#3b3159" opacity="0.55" d="M 112,41 L 128,40 L 133,74 L 117,76 Z"/>
    <!-- broken crown above the capital: two surviving stumps, one leaning -->
    <path fill="#544a70" d="M 44,46 L 47,16 L 61,12 L 64,46 Z"/>
    <path fill="#544a70" d="M 84,46 L 88,26 L 103,30 L 101,46 Z"/>
    <path fill="#8b7ba6" opacity="0.65" d="M 47,16 L 61,12 L 60,21 L 46,25 Z"/>
    <!-- shaft: tapers, and neither side is a straight line -->
    <path fill="#544a70" d="
      M 38,80
      L 34,150 L 40,214 L 33,282 L 39,344 L 35,392
      L 124,392 L 119,344 L 126,282 L 118,214 L 124,150 L 120,80
      Z"/>
    <path fill="#8b7ba6" opacity="0.5" d="
      M 38,80 L 34,150 L 40,214 L 33,282 L 39,344 L 35,392
      L 51,392 L 55,342 L 49,280 L 56,212 L 50,150 L 53,80 Z"/>
    <path fill="#3b3159" opacity="0.6" d="
      M 106,80 L 109,150 L 103,214 L 110,282 L 104,344 L 108,392
      L 124,392 L 119,344 L 126,282 L 118,214 L 124,150 L 120,80 Z"/>
    <!-- deep spall: a chunk gone from the left flank, mid-shaft -->
    <path fill="#3b3159" opacity="0.6" d="M 33,236 L 58,246 L 52,286 L 34,276 Z"/>
    <!-- shallow flute shadows, unevenly spaced -->
    <g fill="#453a5e" opacity="0.4">
      <rect x="66" y="86" width="6" height="300"/>
      <rect x="84" y="90" width="5" height="292"/>
      <rect x="98" y="84" width="4" height="298"/>
    </g>
    <!-- coursing joints -->
    <g fill="#3b3159" opacity="0.4">
      <rect x="36" y="128" width="86" height="4"/>
      <rect x="34" y="222" width="90" height="4"/>
      <rect x="38" y="318" width="82" height="4"/>
    </g>
    <!-- slumped base, wider and irregular -->
    <path fill="#544a70" d="M 26,392 L 132,392 L 140,414 L 18,414 Z"/>
    <path fill="#8b7ba6" opacity="0.45" d="M 26,392 L 44,392 L 34,414 L 18,414 Z"/>
  </g>
</svg>
