<svg xmlns="http://www.w3.org/2000/svg" width="140" height="80" viewBox="0 0 140 80">
  <!-- Broken upper edge of a wall span. Stumps of uneven height AND angle,
       one collapsed low notch, one leaning block that overhangs the shaft. -->
  <g>
    <path fill="#544a70" d="
      M 17,80
      L 22,44 L 31,40 L 34,22 L 46,18 L 49,44
      L 57,36 L 61,52 L 70,30 L 79,34 L 82,12
      L 95,16 L 97,46 L 108,42 L 111,26 L 121,30
      L 123,80
      Z"/>
    <!-- lit tops of the stumps: a thin lip catching the low sun -->
    <path fill="#8b7ba6" opacity="0.7" d="
      M 34,22 L 46,18 L 47,26 L 35,30 Z
      M 70,30 L 79,34 L 78,42 L 69,38 Z
      M 82,12 L 95,16 L 94,25 L 81,21 Z
      M 111,26 L 121,30 L 120,38 L 110,34 Z"/>
    <!-- shadowed right flank -->
    <path fill="#3f3560" opacity="0.6" d="M 104,44 L 123,80 L 111,80 L 99,48 Z"/>
    <!-- a fallen chip resting on the ledge -->
    <path fill="#4a406a" d="M 55,60 L 66,57 L 69,66 L 57,69 Z"/>
  </g>
</svg>
